<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admit Card</title>
    
</head>
<body>
    <div class="container">
        <h2>Admit Card</h2>
        <hr>
        <label for="institution">Name of Institution:</label>
        <select id="institution" name="institution">
            <option value=""></option>
            <option value="glbajaj">G.L Bajaj Institute of Technology and Management</option>
            <option value="gbu">Gautam Buddh University</option>
            <option value="niu">Noida International University</option>
            <option value="galgotias">Galgotias University</option>
        </select>
        <br><br>
        <label for="year">Select Year:</label>
        <select id="year" name="year">
            <option value=""></option>
            <option value="2022-23">2022-23</option>
            <option value="2023-24">2023-24</option>
            <option value="2024-25">2024-25</option>
            <option value="2025-26">2025-26</option>
        </select>
        <br><br>
        <button type="submit">Submit</button>
    </div>
    <style>
        body {
            background-color: #d4eae5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: fit-content;
            min-width: 300px;
        }
        h2 {
            color: #2c3e50;
        }
        label {
            font-size: 18px;
            font-weight: bold;
        }
        select {
            padding: 8px;
            font-size: 16px;
            border: 2px solid #2c3e50;
            border-radius: 5px;
            margin: 10px;
        }
        button {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #1a252f;
        }
    </style>
</body>
</html>
